services:
  postgres:
    image: postgres:16 
    container_name: todoapp-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Mambastik135
      POSTGRES_DB: todoapp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: